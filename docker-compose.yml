services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storycraft
      POSTGRES_PASSWORD: storycraft
      POSTGRES_DB: storycraft
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U storycraft -d storycraft']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v1.1.0
    ports:
      - '3900:3900'
      - '3901:3901'
      - '3902:3902'
      - '3903:3903'
    volumes:
      - garage_data:/var/lib/garage
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
    command: ['/garage', 'server']

volumes:
  postgres_data:
  redis_data:
  garage_data:
