services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storycraft
      POSTGRES_PASSWORD: storycraft
      POSTGRES_DB: storycraft
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U storycraft -d storycraft']
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: storycraft
    volumes:
      - ./infra/backups:/backups
    entrypoint:
      [
        'sh',
        '-c',
        'while true; do pg_dump -h postgres -U storycraft -d storycraft -F c -f /backups/storycraft_$(date +%Y%m%d_%H%M%S).dump; sleep 86400; done',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v1.1.0
    ports:
      - '3900:3900'
      - '127.0.0.1:3901:3901'
      - '127.0.0.1:3902:3902'
      - '127.0.0.1:3903:3903'
    volumes:
      - garage_data:/var/lib/garage
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
    command: ['/garage', 'server']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://storycraft:storycraft@postgres:5432/storycraft?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_started
    command: ['node', 'apps/api/dist/main.js']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
      - '${WEB_PORT:-3000}:3000'
    env_file:
      - .env
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}

volumes:
  postgres_data:
  redis_data:
  garage_data:
